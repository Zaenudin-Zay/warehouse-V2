<style>

  .badge-distribusi { background: var(--mint-light); color: var(--mint-dark); }

  .badge-stok { background: #f1f5f5; color: var(--ink-muted); }

  .badge-err { background: var(--red-light); color: var(--red-dark); }
  .badge-hq { background: var(--navy-light); color: var(--navy-dark); }

  /* table */
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tbl th { text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-muted); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--border); }
  table.tbl td { padding: 7px 10px 7px 0; border-bottom: 1px solid #f1f5f5; }
  table.tbl tr:last-child td { border-bottom: none; }
  .tbl-scroll { max-height: 400px; overflow-y: auto; }
  .product-picker-list { display: none; position: absolute; z-index: 30; top: 100%; left: 0; right: 0; margin-top: 4px; background: #fff; border: 1px solid #c3d6d8; border-radius: 8px; max-height: 260px; overflow-y: auto; box-shadow: 0 8px 20px rgba(28,69,82,.14); }
  .product-picker-item { padding: 8px 10px; font-size: 13px; cursor: pointer; }
  .product-picker-item:hover { background: var(--navy-light); }
  .num { text-align: right; font-weight: 500; }
  .low { color: var(--red); }
  .muted { color: #93aeb2; font-size: 12px; }
  code.inline { background: #f1f5f5; padding: 2px 5px; border-radius: 4px; font-size: 12px; }

  /* flow row */
  .flow-row { display: flex; align-items: center; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .flow-node { flex-shrink: 0; border-radius: 10px; border: 1px solid #bcd8dd; background: var(--navy-light); padding: 10px 16px; min-width: 140px; }
  .flow-node.rose { border-color: #ffc2c2; background: var(--red-light); }
  .flow-node .lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--navy); opacity: .85; }
  .flow-node.rose .lbl { color: var(--red-dark); }
  .flow-arrow { flex-shrink: 0; color: #a9c6ca; }
  .flow-node .val { font-size: 17px; font-weight: 600; color: var(--navy-dark); }
  .flow-node .sub { font-size: 11px; color: var(--navy); opacity: .8; margin-top: 1px; }

  /* toast */
  #toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 500; box-shadow: 0 8px 20px rgba(28,69,82,.2); display: none; z-index: 50; }

  /* login */
  .login-wrap { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy-dark); }
  .login-card { width: 360px; background: #fff; border-radius: 14px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .login-welcome { font-size: 26px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
  .login-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--ink); margin-bottom: 6px; }
  .login-logo { width: 32px; height: 32px; border-radius: 7px; }

  .login-hint { font-size: 11px; color: #93aeb2; margin-top: 16px; line-height: 1.6; }
  .user-badge { display: flex; flex-direction: column; align-items: flex-end; font-size: 11px; color: var(--ink-muted); line-height: 1.4; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }

  .bar-val { width: 42px; text-align: right; font-weight: 600; color: var(--ink); }

  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-muted); margin-top: 4px; }
</style>

<div id="root"></div>
<div id="toast"></div>

<script>
// ============================================================================
// NORMALIZED DATABASE VERSION
// Updated to use normalized tables instead of JSON blob
// ============================================================================

const SUPABASE_URL = "https://klczlrjucqmkjrjkbiif.supabase.co";
const SUPABASE_KEY = "sb_publishable_unu8hSPpP5UeKMmRrGjsEA_CCELGfRy";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================================
// DATA LOADING FUNCTIONS (FROM NORMALIZED TABLES)
// ============================================================================

/**
 * Load all products from database
 * Column mappings: material_code→materialCode, family_paket→familyPaket
 * @throws {Error} Database error on query failure
 */
/**
 * Fetch ALL rows from a Supabase table, bypassing the default 1000-row
 * response cap by paging through with .range() until a page comes back
 * shorter than the page size. Without this, tables that grow past 1000
 * rows (warehouse_stock, sales_stock, transactions, ...) would silently
 * lose data on every reload.
 */
async function fetchAllRows(table, opts) {
  const pageSize = 1000;
  let all = [];
  let from = 0;
  while (true) {
    let q = sb.from(table).select(opts && opts.columns ? opts.columns : '*');
    if (opts && opts.orderBy) q = q.order(opts.orderBy, { ascending: opts.ascending !== false });
    const { data, error } = await q.range(from, from + pageSize - 1);
    if (error) throw error;
    all = all.concat(data);
    if (!data.length || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

async function loadProducts() {
  const data = await fetchAllRows('products');
  return data.map(p => ({
    id: p.id,
    name: p.name,
    category: p.category,
    brand: p.brand,
    materialCode: p.material_code,
    familyPaket: p.family_paket,
    cluster: p.cluster,
    price: p.price
  }));
}

/**
 * Load all warehouses from database
 * No column transformations needed (all columns already in camelCase)
 * @throws {Error} Database error on query failure
 */
async function loadWarehouses() {
  const data = await fetchAllRows('warehouses');
  return data.map(w => ({
    id: w.id,
    name: w.name,
    type: w.type,
    kota: w.kota,
    cluster: w.cluster
  }));
}

async function loadSalesTeam() {
  const data = await fetchAllRows('sales_team');
  return data.map(s => ({
    id: s.id,
    name: s.name,
    gudang: s.gudang,
    supervisor: s.supervisor
  }));
}

/**
 * Load warehouse stock from database
 * Transform flat rows into nested dictionary: { warehouse_id: { product_id: quantity } }
 * This transformation allows O(1) lookup for stock quantities by warehouse and product.
 * @throws {Error} Database error on query failure
 */
async function loadWarehouseStock() {
  const data = await fetchAllRows('warehouse_stock');

  // Build nested dictionary for efficient lookups
  const stock = {};
  data.forEach(row => {
    // Initialize warehouse object if not exists
    if (!stock[row.warehouse_id]) stock[row.warehouse_id] = {};
    // Map product_id to quantity within warehouse
    stock[row.warehouse_id][row.product_id] = row.quantity;
  });
  return stock;
}

/**
 * Load sales stock from database
 * Transform flat rows into nested dictionary: { sales_id: { product_id: quantity } }
 * This transformation allows O(1) lookup for stock quantities by sales team and product.
 * @throws {Error} Database error on query failure
 */
async function loadSalesStock() {
  const data = await fetchAllRows('sales_stock');

  // Build nested dictionary for efficient lookups
  const salesStock = {};
  data.forEach(row => {
    // Initialize sales team object if not exists
    if (!salesStock[row.sales_id]) salesStock[row.sales_id] = {};
    // Map product_id to quantity within sales team
    salesStock[row.sales_id][row.product_id] = row.qty;
  });
  return salesStock;
}

async function loadTransactions() {
  const data = await fetchAllRows('transactions', { orderBy: 'date', ascending: false });

  return data.map(t => ({
    id: t.id,
    type: t.type,
    date: t.date,
    from: t.from_location,
    to: t.to_location,
    productId: t.product_id,
    qty: t.qty,
    note: t.note
  }));
}

async function loadReturItems() {
  const data = await fetchAllRows('retur_items');

  return data.map(r => ({
    id: r.id,
    productId: r.product_id,
    qty: r.qty,
    sourceType: r.source_type,
    sourceId: r.source_id,
    reason: r.reason,
    status: r.status,
    date: r.date,
    resolvedDate: r.resolved_date
  }));
}

async function loadUsers() {
  const data = await fetchAllRows('users');

  return data.map(u => ({
    id: u.id,
    username: u.username,
    password: u.password,
    name: u.name,
    role: u.role,
    cabangId: u.cabang_id,
    gudangPusat: u.gudang_pusat_id
  }));
}

// ============================================================================
// LEGACY PATTERN REMOVED
// The following legacy storage pattern has been removed for normalized database migration:
// - STORAGE_KEY constant (previously "gudang-sim-data-v5")
// - dbGet() function (localStorage retrieval)
// - dbSet() function (localStorage persistence)
// All data operations now use direct Supabase table operations.
// ============================================================================

// ---------------- utilities ----------------

function uid(prefix) { return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8); }
function fmtDate(d) { return new Date(d).toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }); }
function fmtDateShort(d) { return new Date(d).toLocaleDateString("id-ID", { day: "2-digit", month: "short" }); }
function fmtMonthShort(d) { return new Date(d).toLocaleDateString("id-ID", { month: "short", year: "2-digit" }); }

// ---------------- period / date filter ----------------
function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function endOfDay(d) { const x = new Date(d); x.setHours(23,59,59,999); return x; }
function getPeriodRange() {
  const now = new Date();
  const p = state.ui.period;
  if (p === "today") return { start: startOfDay(now), end: endOfDay(now) };
  if (p === "7d") { const s = new Date(now); s.setDate(s.getDate()-6); return { start: startOfDay(s), end: endOfDay(now) }; }
  if (p === "30d") { const s = new Date(now); s.setDate(s.getDate()-29); return { start: startOfDay(s), end: endOfDay(now) }; }
  if (p === "month") return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: endOfDay(now) };
  if (p === "year") return { start: new Date(now.getFullYear(), 0, 1), end: endOfDay(now) };
  if (p === "custom") {
    const start = state.ui.periodFrom ? startOfDay(new Date(state.ui.periodFrom)) : null;
    const end = state.ui.periodTo ? endOfDay(new Date(state.ui.periodTo)) : null;
    return { start, end };
  }
  return { start: null, end: null }; // "all"
}
function inPeriod(dateStr) {
  const { start, end } = getPeriodRange();
  if (!start && !end) return true;
  const d = new Date(dateStr);
  if (start && d < start) return false;
  if (end && d > end) return false;
  return true;
}
function periodLabel() {
  const labels = { all: "Semua waktu", today: "Hari ini", "7d": "7 hari terakhir", "30d": "30 hari terakhir", month: "Bulan ini", year: "Tahun ini", custom: "Periode kustom" };
  return labels[state.ui.period] || "Semua waktu";
}
function renderPeriodFilter() {
  const p = state.ui.period;
  return '<div class="section" style="padding:14px 20px"><div class="row" style="justify-content:space-between">' +
    '<div class="row">' +
      '<span class="muted" style="font-weight:600;color:#5d7a80">Periode:</span>' +
      '<select class="input" onchange="onPeriodChange(this.value)">' +
        ["all","today","7d","30d","month","year","custom"].map(v => '<option value="'+v+'"'+(v===p?" selected":"")+'>'+({all:"Semua waktu",today:"Hari ini",'7d':"7 hari terakhir",'30d':"30 hari terakhir",month:"Bulan ini",year:"Tahun ini",custom:"Kustom (pilih tanggal)"}[v])+'</option>').join("") +
      '</select>' +
      (p === "custom" ? (
        '<input type="date" class="input" value="'+esc(state.ui.periodFrom)+'" onchange="onPeriodCustom(this.value, null)">' +
        '<span class="muted">s/d</span>' +
        '<input type="date" class="input" value="'+esc(state.ui.periodTo)+'" onchange="onPeriodCustom(null, this.value)">'
      ) : "") +
    '</div>' +
  '</div></div>';
}
function onPeriodChange(v) { state.ui.period = v; render(); }
function onPeriodCustom(from, to) {
  if (from !== null) state.ui.periodFrom = from;
  if (to !== null) state.ui.periodTo = to;
  render();
}
function esc(s) { return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function nfmt(n) { return Number(n || 0).toLocaleString("id-ID"); }
function rupiah(n) { return "Rp " + nfmt(Math.round(n || 0)); }
function buildPriceMap() {
  const map = {};
  state.data.products.forEach(p => map[p.id] = p.price || 0);
  return map;
}
function sumStockValue(stockObj, priceMap) {
  return Object.entries(stockObj || {}).reduce((a, [pid, qty]) => a + (qty || 0) * (priceMap[pid] || 0), 0);

/**
 * Initialize seed data into empty database
 * INSERTION ORDER: Critical for foreign key dependencies
 * 1. Products (no dependencies)
 * 2. Warehouses (no dependencies)
 * 3. Sales team (depends on warehouses via gudang FK)
 * 4. Users (depends on warehouses via cabang_id FK)
 * 5. Warehouse stock (depends on products & warehouses)
 * @throws {Error} Any database operation failure
 */
async function initializeSeedData() {
  try {
    // 1. INSERT products from CATALOG_SEED with column mapping
    console.log('Seeding products...');
    const productsToInsert = CATALOG_SEED.map(p => ({
      id: p.id,
      name: p.name,
      category: p.category,
      brand: p.brand,
      material_code: p.materialCode,
      family_paket: p.familyPaket,
      cluster: p.cluster,
      price: p.price
    }));
    
    const { error: prodError } = await sb.from('products').insert(productsToInsert);
    if (prodError) throw new Error('Failed to insert products: ' + prodError.message);

    // 2. INSERT default warehouses (HQ + branches)

function buildSeed() {
  const products = buildProducts();

  const primaryCluster = (products.find(p => p.cluster) || {}).cluster || "";
  const warehouses = [
    { id: "pusat", name: primaryCluster ? "Gudang Pusat - " + primaryCluster : "Gudang Pusat", type: "pusat", kota: primaryCluster || "-" },
    { id: "cabang-1", name: "BO Magelang", type: "cabang", kota: "Magelang" },
  ];

  const salesTeam = [];

  const stock = {};
  warehouses.forEach((w) => {
    stock[w.id] = {};
    products.forEach((p) => {
      stock[w.id][p.id] = w.type === "pusat" ? (STOCK_AWAL_SEED[p.id] !== undefined ? STOCK_AWAL_SEED[p.id] : 0) : 0;
    });
  });

  const salesStock = {};

  const transactions = [];
  const today = new Date();
  for (let i = 13; i >= 0; i--) {
    const day = new Date(today); day.setDate(day.getDate() - i);
    const iso = day.toISOString();
    const masukQty = 80 + ((i * 37) % 60);
    const prod = products[(i * 5) % products.length];
    transactions.push({ id: uid("trx"), type: "masuk", date: iso, to: "pusat", productId: prod.id, qty: masukQty, note: "Restock dari principal" });
  }

  const branchWarehouse = warehouses.find(w => w.type === "cabang") || warehouses[0];
  const returItems = [
    { id: uid("ret"), productId: products[10] ? products[10].id : products[0].id, qty: 25, sourceType: "cabang", sourceId: branchWarehouse.id, reason: "Kartu gagal aktivasi / rusak dari principal", status: "menunggu_penggantian", date: new Date(today.getTime() - 3*86400000).toISOString() },
  ];

  const users = [
    { id: uid("user"), username: "HQ.001", password: "hq123", name: "Headquarter", role: "hq", cabangId: "" },
    { id: uid("user"), username: "admin.pusat", password: "admin123", name: "Admin Pusat", role: "admin_pusat", cabangId: "" },
    { id: uid("user"), username: "admin.cabang", password: "admin123", name: "Admin Cabang", role: "admin_cabang", cabangId: branchWarehouse.id },
  ];

  return { products, warehouses, salesTeam, stock, salesStock, transactions, returItems, users };
}

async function loadData() {
  try {
    // Load all data in parallel from normalized tables
    const [products, warehouses, salesTeam, warehouseStock, salesStock, transactions, returItems, users] =
      await Promise.all([
        loadProducts(),
        loadWarehouses(),
        loadSalesTeam(),
        loadWarehouseStock(),
        loadSalesStock(),
        loadTransactions(),
        loadReturItems(),
        loadUsers()
      ]);

    // Populate state with loaded data
    state.data = {
      products,
      warehouses,
      salesTeam,
      stock: warehouseStock,
      salesStock,
      transactions,
      returItems,
      users
    };

    // Initialize seed data if database is empty
    if (products.length === 0 && warehouses.length === 0) {
      if (typeof initializeSeedData === 'function') {
        await initializeSeedData();
        await loadData(); // Reload after seeding
        notify("Database initialized with seed data", "success");
        return;
      }
    }

    // Handle missing users (legacy compatibility)
    if (!state.data.users || !state.data.users.length) {
      // Initialize default HQ user if no users exist
      const seed = buildSeed();
      state.data.users = seed.users;
      // Save users to database
      for (const user of seed.users) {
        const { error: seedUserError } = await sb.from('users').insert({
          username: user.username,
          password: user.password,
          name: user.name,
          role: user.role,
          cabang_id: user.cabangId || null
        });
        if (seedUserError) console.error('Gagal membuat user awal ' + user.username + ':', seedUserError);
      }
    }
  } catch (e) {
    console.error("gagal memuat dari Supabase", e);
    state.loadError = (e && e.message) ? e.message : String(e);
    notify("Gagal memuat data: " + ((e && e.message) ? e.message : String(e)), "error");
  }
}

async function stockIn(warehouseId, productId, qty, note) {
  if (!warehouseId || !productId || !qty || qty <= 0)
    return notify("Lengkapi gudang, produk dan jumlah", "error");

  try {
    // 1. Insert transaction
    const { error: txError } = await sb.from('transactions').insert({
      id: uid('trx'),
      type: 'masuk',
      date: new Date().toISOString(),
      to_location: warehouseId,
      product_id: productId,
      qty: qty,
      note: note || 'Barang masuk dari principal'
    });
    if (txError) throw txError;

    // 2. Update warehouse stock
    const currentQty = state.data.stock[warehouseId]?.[productId] || 0;
    const { error: stockError } = await sb.from('warehouse_stock').upsert({
      warehouse_id: warehouseId,
      product_id: productId,
      quantity: currentQty + qty
    }, { onConflict: 'warehouse_id,product_id' });
    if (stockError) throw stockError;

    // 3. Reload and render
    await loadData();
    render();
    notify("Barang masuk berhasil dicatat");
  } catch (e) {
    console.error('stockIn error:', e);
    notify("Gagal menyimpan: " + (e.message || e), "error");
  }
}

async function transferWarehouse(fromId, toId, productId, qty) {
  // NOTE: This is a multi-step operation without transaction wrapper
  // In production, consider using Supabase RPC for atomicity
  
  if (!fromId || !toId || !productId || !qty || qty <= 0)
    return notify("Lengkapi gudang asal, tujuan, produk dan jumlah", "error");
  
  if (fromId === toId)
    return notify("Gudang asal dan tujuan harus berbeda", "error");

  const avail = state.data.stock[fromId]?.[productId] || 0;
  if (qty > avail)
    return notify("Stok gudang asal tidak cukup (tersedia " + avail + ")", "error");

  try {
    // 1. Insert transaction
    const { error: txError } = await sb.from('transactions').insert({
      id: uid('trx'),
      type: 'transfer',
      date: new Date().toISOString(),
      from_location: fromId,
      to_location: toId,
      product_id: productId,
      qty: qty,
      note: 'Transfer antar gudang'
    });
    if (txError) throw txError;

    // 2. Decrease source warehouse stock
    const { error: fromError } = await sb.from('warehouse_stock').upsert({
      warehouse_id: fromId,
      product_id: productId,
      quantity: avail - qty
    }, { onConflict: 'warehouse_id,product_id' });
    if (fromError) throw fromError;

    // 3. Increase destination warehouse stock
    const toQty = state.data.stock[toId]?.[productId] || 0;
    const { error: toError } = await sb.from('warehouse_stock').upsert({
      warehouse_id: toId,
      product_id: productId,
      quantity: toQty + qty
    }, { onConflict: 'warehouse_id,product_id' });
    if (toError) throw toError;

    await loadData();
    render();
    notify("Transfer antar gudang berhasil");
  } catch (e) {
    console.error('transferWarehouse error:', e);
    notify("Gagal transfer: " + (e.message || e), "error");
  }
}

async function distribusiToSales(warehouseId, salesId, productId, qty) {
  if (!warehouseId || !salesId || !productId || !qty || qty <= 0)
    return notify("Lengkapi gudang asal, sales, produk dan jumlah", "error");

  const avail = state.data.stock[warehouseId]?.[productId] || 0;
  if (qty > avail)
    return notify("Stok gudang tidak cukup (tersedia " + avail + ")", "error");

  try {
    // 1. Insert transaction
    const { error: txError } = await sb.from('transactions').insert({
      id: uid('trx'),
      type: 'distribusi',
      date: new Date().toISOString(),
      from_location: warehouseId,
      to_location: salesId,
      product_id: productId,
      qty: qty,
      note: 'Distribusi ke tim sales'
    });
    if (txError) throw txError;

    // 2. Decrease warehouse stock
    const { error: fromError } = await sb.from('warehouse_stock').upsert({
      warehouse_id: warehouseId,
      product_id: productId,
      quantity: avail - qty
    }, { onConflict: 'warehouse_id,product_id' });

    }, { onConflict: 'sales_id,product_id' });

function buildAllocationRows(dataRows) {
  const groups = {};
  dataRows.forEach(r => {
    const canvasserId = pickField(r, ["Canvasser ID","canvasser id","sales id","id sales"]).toString().trim();
    const productId = pickField(r, ["Product ID","product id","kode produk","sku"]).toString().trim();
    const totalRaw = pickField(r, ["Total","qty","jumlah","total product"]);
    const qty = parseInt((totalRaw||"0").toString().replace(/[^0-9-]/g,""), 10) || 0;
    if (!canvasserId && !productId) return;
    const key = canvasserId + "||" + productId;
    if (!groups[key]) groups[key] = { canvasserId, productId, qty: 0 };
    groups[key].qty += qty;
  });

  const gudangId = state.ui.allocationGudang;
  const runningStock = {};

  return Object.values(groups).map((g, i) => {
    const sales = state.data.salesTeam.find(s => s.id === g.canvasserId);
    const prod = state.data.products.find(p => p.id === g.productId);
    let status = "ok", issue = "";
    if (!gudangId) { status = "error"; issue = "Pilih gudang asal dulu"; }
    else if (!sales) { status = "error"; issue = "Canvasser ID tidak ditemukan di tim sales"; }
    else if (!prod) { status = "error"; issue = "Product ID tidak ditemukan di katalog"; }
    else if (!g.qty || g.qty <= 0) { status = "error"; issue = "Jumlah tidak valid"; }
    else {
      if (runningStock[g.productId] === undefined) runningStock[g.productId] = state.data.stock[gudangId]?.[g.productId] || 0;
      if (g.qty > runningStock[g.productId]) { status = "error"; issue = "Stok gudang tidak cukup (sisa " + runningStock[g.productId] + ")"; }
      else runningStock[g.productId] -= g.qty;
    }
    return {
      key: i, qty: g.qty,
      salesId: g.canvasserId, salesName: sales ? sales.name : g.canvasserId,
      productId: g.productId, productName: prod ? prod.name : g.productId,
      status, issue,
    };
  });
}
function handleAllocationFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  state.ui.allocationFileName = file.name;
  const ext = file.name.split(".").pop().toLowerCase();
  if (ext === "csv") {
    Papa.parse(file, { header: true, skipEmptyLines: true, complete: (results) => {
      state.ui.allocationRows = buildAllocationRows(results.data);
      render();
    }});
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      state.ui.allocationRows = buildAllocationRows(rows);
      render();
    };
    reader.readAsArrayBuffer(file);
  }
}
function onAllocationGudangChange(v) {
  state.ui.allocationGudang = v;
  if (state.ui.allocationRows.length) state.ui.allocationRows = buildAllocationRows(state.ui.allocationRows.map(r => ({
    "Canvasser ID": r.salesId, "Product ID": r.productId, "Total": r.qty
  })));
  render();
}
async function applyAllocationImport() {
  const gudangId = state.ui.allocationGudang;
  const rows = state.ui.allocationRows.filter(r => r.status === "ok");
  if (!gudangId) return notify("Pilih gudang asal dulu", "error");
  if (!rows.length) return notify("Tidak ada baris valid untuk diproses", "error");

  notify("Menerapkan " + rows.length + " baris, mohon tunggu...", "warning");

  try {
    // Hitung stok gudang akhir per produk (bisa berkurang dari beberapa
    // baris berbeda untuk produk yang sama), lalu kirim sebagai satu batch.
    const stockDelta = {};
    rows.forEach(r => {
      if (stockDelta[r.productId] === undefined) stockDelta[r.productId] = state.data.stock[gudangId]?.[r.productId] || 0;
      stockDelta[r.productId] -= r.qty;
    });
    const stockPayload = Object.entries(stockDelta).map(([productId, quantity]) => ({
      warehouse_id: gudangId, product_id: productId, quantity
    }));
    const { data: stockData, error: stockError } = await sb.from('warehouse_stock')
      .upsert(stockPayload, { onConflict: 'warehouse_id,product_id' }).select();
    if (stockError) throw stockError;
    if (!stockData || stockData.length !== stockPayload.length)
      throw new Error("Stok gudang hanya " + (stockData?stockData.length:0) + "/" + stockPayload.length + " baris tersimpan (kemungkinan diblokir izin akses Supabase)");

    // Baris sudah unik per (sales, produk) dari proses grouping sebelumnya,
    // jadi stok sales bisa langsung dikirim sebagai satu batch juga.
    const salesPayload = rows.map(r => ({
      sales_id: r.salesId, product_id: r.productId,
      qty: (state.data.salesStock[r.salesId]?.[r.productId] || 0) + r.qty
    }));
    const { data: salesData, error: salesError } = await sb.from('sales_stock')
      .upsert(salesPayload, { onConflict: 'sales_id,product_id' }).select();
    if (salesError) throw salesError;
    if (!salesData || salesData.length !== salesPayload.length)
      throw new Error("Stok sales hanya " + (salesData?salesData.length:0) + "/" + salesPayload.length + " baris tersimpan (kemungkinan diblokir izin akses Supabase)");

    const txPayload = rows.map(r => ({
      id: uid('trx'), type: 'distribusi', date: new Date().toISOString(),
      from_location: gudangId, to_location: r.salesId, product_id: r.productId, qty: r.qty,
      note: 'Input Allocation Log'
    }));
    const { error: txError } = await sb.from('transactions').insert(txPayload);
    if (txError) throw txError;

    state.ui.allocationRows = [];
    state.ui.allocationFileName = "";
    await loadData();
    render();
    notify(rows.length + " baris berhasil didistribusikan");
  } catch (e) {
    console.error('applyAllocationImport error:', e);
    notify("Gagal proses allocation log: " + (e.message || e), "error");
  }
}

async function addSalesPerson(id, name, gudangId, supervisor) {
  // 1. INPUT VALIDATION
  id = (id || "").trim();
  name = (name || "").trim();
  if (!id || !name) return notify("ID Sales dan Nama Sales wajib diisi", "error");

  // 2. BUSINESS LOGIC VALIDATION - Check for duplicate ID
  if (state.data.salesTeam.find(s => s.id.toLowerCase() === id.toLowerCase()))
    return notify("ID Sales \"" + id + "\" sudah dipakai", "error");

  try {
    // 3. DATABASE OPERATION - Insert sales person
    const { error: salesError } = await sb.from('sales_team').insert({
      id: id,
      name: name,
      gudang: gudangId || null,
      supervisor: (supervisor || "").trim() || null
    });
    if (salesError) throw salesError;

    // 4. DATABASE OPERATION - Initialize stock rows for all products
    const stockInserts = state.data.products.map(p => ({
      sales_id: id,
      product_id: p.id,
      qty: 0
    }));
    const { error: stockError } = await sb.from('sales_stock').insert(stockInserts);
    if (stockError) throw stockError;

    // 5. RELOAD DATA
    state.ui.salesSelectedStok = id;
    await loadData();

    // 6. UPDATE UI
    render();

    // 7. SUCCESS NOTIFICATION
    notify(name + " ditambahkan ke tim sales");
  } catch (e) {
    console.error('addSalesPerson error:', e);
    notify("Gagal menambahkan sales: " + (e.message || e), "error");
  }
}

async function deleteSalesPerson(id) {
  // 1. INPUT VALIDATION - Find sales person
  const sales = state.data.salesTeam.find(s => s.id === id);
  if (!sales) return;

  // 2. BUSINESS LOGIC VALIDATION - Check total stock must be 0
  const totalStock = Object.values(state.data.salesStock[id] || {}).reduce((a,b)=>a+b,0);
  if (totalStock > 0)
    return notify("Stok " + sales.name + " harus dikosongkan dulu (sisa " + nfmt(totalStock) + " unit)", "error");

  try {
    // 3. DATABASE OPERATION - Delete from sales_team (CASCADE will handle sales_stock)
    const { error } = await sb.from('sales_team').delete().eq('id', id);
    if (error) throw error;

    // 4. RELOAD DATA
    if (state.ui.salesSelectedStok === id) state.ui.salesSelectedStok = "";
    await loadData();

    // 5. UPDATE UI
    render();

    // 6. SUCCESS NOTIFICATION
    notify(sales.name + " berhasil dihapus dari tim sales");
  } catch (e) {
    console.error('deleteSalesPerson error:', e);
    notify("Gagal menghapus sales: " + (e.message || e), "error");
  }
}

async function reportIssue(sourceType, sourceId, productId, qty, reason) {
  if (!sourceId || !productId || !qty || qty <= 0)
    return notify("Lengkapi lokasi, produk dan jumlah", "error");

  const bucket = sourceType === "sales" ? state.data.salesStock : state.data.stock;
  const avail = bucket[sourceId]?.[productId] || 0;
  if (qty > avail)
    return notify("Stok di lokasi tersebut tidak cukup (tersedia " + avail + ")", "error");

  try {
    const returId = uid('ret');

    // 1. Insert retur item
    const { error: returError } = await sb.from('retur_items').insert({
      id: returId,
      product_id: productId,
      qty: qty,
      source_type: sourceType,
      source_id: sourceId,
      reason: reason || "-",
      status: "menunggu_penggantian",
      date: new Date().toISOString()
    });
    if (returError) throw returError;

    // 2. Insert transaction
    const { error: txError } = await sb.from('transactions').insert({
      id: uid('trx'),
      type: 'retur_keluar',
      date: new Date().toISOString(),
      from_location: sourceId,
      product_id: productId,
      qty: qty,
      note: reason || "Barang bermasalah, menunggu penggantian principal"
    });
    if (txError) throw txError;

    // 3. Decrease stock
    if (sourceType === "sales") {
      const { error: stockError } = await sb.from('sales_stock').upsert({
        sales_id: sourceId,
        product_id: productId,
        qty: avail - qty
      }, { onConflict: 'sales_id,product_id' });
      if (stockError) throw stockError;
    } else {
      const { error: stockError } = await sb.from('warehouse_stock').upsert({
        warehouse_id: sourceId,
        product_id: productId,
        quantity: avail - qty
      }, { onConflict: 'warehouse_id,product_id' });
      if (stockError) throw stockError;
    }

    await loadData();
    render();
    notify("Barang bermasalah dicatat, menunggu penggantian principal", "warning");
  } catch (e) {
    console.error('reportIssue error:', e);
    notify("Gagal melaporkan: " + (e.message || e), "error");
  }
}

async function resolveReplacement(returId) {
  const item = state.data.returItems.find(r => r.id === returId);
  if (!item) return;

  try {
    // 1. Update retur status
    const { error: returUpdError } = await sb.from('retur_items').update({
      status: 'selesai_diganti',
      resolved_date: new Date().toISOString()
    }).eq('id', returId);
    if (returUpdError) throw returUpdError;

    // 2. Insert transaction
    const targetPusatId = myGudangPusatId() || 'pusat';
    const { error: txError } = await sb.from('transactions').insert({
      id: uid('trx'),
      type: 'penggantian_masuk',
      date: new Date().toISOString(),
      to_location: targetPusatId,
      product_id: item.productId,
      qty: item.qty,
      note: "Penggantian dari principal diterima"
    });
    if (txError) throw txError;

    // 3. Increase pusat stock
    const pusatQty = state.data.stock[targetPusatId]?.[item.productId] || 0;
    const { error: stockError } = await sb.from('warehouse_stock').upsert({
      warehouse_id: targetPusatId,
      product_id: item.productId,
      quantity: pusatQty + item.qty
    }, { onConflict: 'warehouse_id,product_id' });
    if (stockError) throw stockError;

    await loadData();
    render();
    notify("Penggantian diterima, stok gudang pusat diperbarui");
  } catch (e) {
    console.error('resolveReplacement error:', e);
    notify("Gagal resolve: " + (e.message || e), "error");
  }
}

async function applyCatalogImport() {
  const rows = state.ui.catalogRows.filter(r => r.status === "new" || r.status === "update");
  if (!rows.length) return;

  const btn = document.getElementById('btn-terapkan-katalog');
  const btnOriginalText = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "Memproses " + rows.length + " produk, mohon tunggu..."; }

  try {
    // Cek langsung ke database (bukan cache lokal) supaya akurat meski
    // produk itu baru saja ditambahkan lewat cluster/sesi lain.
    const freshProducts = await fetchAllRows('products', { columns: 'id' });
    const existingIds = new Set((freshProducts || []).map(p => p.id));

    const newRows = rows.filter(r => !existingIds.has(r.id));
    const added = newRows.length;
    const updated = rows.length - added;

    // 1. Simpan semua produk (baru + update) dalam SATU batch upsert,
    //    bukan satu-satu - jauh lebih cepat untuk ratusan baris.
    const productPayload = rows.map(r => ({
      id: r.id, name: r.name, category: r.category, brand: r.brand,
      material_code: r.materialCode, family_paket: r.familyPaket,
      cluster: r.cluster, price: r.price
    }));
    for (let i = 0; i < productPayload.length; i += 200) {
      const { error: prodErr } = await sb.from('products')
        .upsert(productPayload.slice(i, i + 200), { onConflict: 'id' });
      if (prodErr) throw prodErr;
    }

    // 2. Inisialisasi stok awal (qty 0) HANYA untuk produk yang baru,
    //    dikirim sebagai batch besar juga - bukan per gudang/per sales.
    if (newRows.length) {
      const wsPayload = [];
      for (const w of state.data.warehouses) {
        for (const r of newRows) wsPayload.push({ warehouse_id: w.id, product_id: r.id, quantity: 0 });
      }
      for (let i = 0; i < wsPayload.length; i += 500) {
        const { error: wsError } = await sb.from('warehouse_stock')
          .upsert(wsPayload.slice(i, i + 500), { onConflict: 'warehouse_id,product_id', ignoreDuplicates: true });
        if (wsError) throw wsError;
      }

      const ssPayload = [];
      for (const s of state.data.salesTeam) {
        for (const r of newRows) ssPayload.push({ sales_id: s.id, product_id: r.id, qty: 0 });
      }
      for (let i = 0; i < ssPayload.length; i += 500) {
        const { error: ssError } = await sb.from('sales_stock')
          .upsert(ssPayload.slice(i, i + 500), { onConflict: 'sales_id,product_id', ignoreDuplicates: true });
        if (ssError) throw ssError;
      }
    }

    // Update warehouse name if cluster changed (hanya untuk admin pusat yang
    // memang terikat ke satu gudang pusat spesifik - HQ dilewati karena
    // tidak ada satu gudang pusat tunggal yang jadi acuan)
    const importedCluster = (rows.find(r => r.cluster) || {}).cluster;
    if (importedCluster && isPusatAdmin() && myGudangPusatId()) {
      const pusat = state.data.warehouses.find(w => w.id === myGudangPusatId());
      const newName = "Gudang Pusat - " + importedCluster;
      if (pusat && pusat.name !== newName) {
        const { error: whUpdError } = await sb.from('warehouses').update({
          name: newName,
          kota: importedCluster
        }).eq('id', myGudangPusatId());
        if (whUpdError) throw whUpdError;
      }
    }

    state.ui.catalogRows = [];
    state.ui.catalogFileName = "";
    await loadData();
    render();
    notify(added + " produk baru ditambahkan, " + updated + " produk diperbarui");
  } catch (e) {
    console.error('applyCatalogImport error:', e);
    notify("Gagal import: " + (e.message || e), "error");
    const btnRetry = document.getElementById('btn-terapkan-katalog');
    if (btnRetry) { btnRetry.disabled = false; btnRetry.textContent = btnOriginalText; }
  }
}

function csvCell(v) {
  const s = (v===undefined||v===null) ? "" : v.toString();
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadCSV(filename, headers, rows) {
  const lines = [headers.map(csvCell).join(",")].concat(rows.map(r => r.map(csvCell).join(",")));
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function matchWarehouseByLabel(label) {
  // Admin yang sudah terikat ke satu gudang (pusat/cabang) selalu diarahkan
  // ke gudangnya sendiri, apa pun teks di kolom Keterangan - supaya tidak
  // bisa "nyasar" menulis stok ke gudang pusat/cabang milik cluster lain.
  if (isPusatAdmin()) return state.data.warehouses.find(w => w.id === myGudangPusatId()) || null;
  if (isCabangAdmin()) return state.data.warehouses.find(w => w.id === myCabangId()) || null;

  const n = normalize(label);
  if (!n) return null;
  if (n.includes("pusat")) return state.data.warehouses.find(w => w.type === "pusat") || null;
  return state.data.warehouses.find(w => normalize(w.name) === n) ||
    state.data.warehouses.find(w => normalize(w.name).includes(n) || n.includes(normalize(w.name))) || null;
}
function buildStockImportRows(dataRows) {
  return dataRows.map((r, i) => {
    const productId = pickField(r, ["Product ID","id","sku","kode"]).toString().trim();
    const qtyRaw = pickField(r, ["Stok Awal","stok","qty","jumlah"]);
    const qty = parseInt((qtyRaw||"0").toString().replace(/[^0-9-]/g,""), 10) || 0;
    const keteranganRaw = pickField(r, ["Keterangan","gudang","warehouse","lokasi"]).toString().trim();
    const prod = state.data.products.find(p => p.id === productId);
    const wh = matchWarehouseByLabel(keteranganRaw);
    let status = "ok", issue = "";
    if (!prod) { status = "error"; issue = "Produk tidak ditemukan"; }
    else if ((isPusatAdmin() || isCabangAdmin()) && prod.cluster !== myCluster()) { status = "error"; issue = "Produk bukan milik cluster Anda (" + (myCluster()||"-") + ")"; }
    else if (!wh) { status = "error"; issue = "Gudang \"" + (keteranganRaw||"-") + "\" tidak ditemukan"; }
    return { key: i, productId, productName: prod ? prod.name : productId, qty, keterangan: keteranganRaw, warehouseId: wh ? wh.id : null, warehouseName: wh ? wh.name : (keteranganRaw||"-"), status, issue };
  });
}
function handleStockImportFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  state.ui.stockImportFileName = file.name;
  const ext = file.name.split(".").pop().toLowerCase();
  if (ext === "csv") {
    Papa.parse(file, { header: true, skipEmptyLines: true, complete: (results) => {
      state.ui.stockImportRows = buildStockImportRows(results.data);
      render();
    }});
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      state.ui.stockImportRows = buildStockImportRows(rows);
      render();
    };
    reader.readAsArrayBuffer(file);
  }
}
async function applyStockImport() {
  const rows = state.ui.stockImportRows.filter(r => r.status === "ok");
  if (rows.length === 0) return;

  notify("Menerapkan " + rows.length + " baris, mohon tunggu...", "warning");

  try {
    // Dedupe by warehouse+product (keep the last occurrence) so a single
    // bulk upsert never targets the same conflict key twice in one call.
    const dedup = {};
    rows.forEach(r => { dedup[r.warehouseId + "||" + r.productId] = r; });
    const uniqueRows = Object.values(dedup);

    const stockPayload = uniqueRows.map(r => ({ warehouse_id: r.warehouseId, product_id: r.productId, quantity: r.qty }));
    const { error: stockError } = await sb.from('warehouse_stock').upsert(stockPayload, { onConflict: 'warehouse_id,product_id' });
    if (stockError) throw stockError;

    const txPayload = uniqueRows.map(r => ({
      id: uid('trx'), type: 'stok_awal', date: new Date().toISOString(),
      to_location: r.warehouseId, product_id: r.productId, qty: r.qty,
      note: "Update stok awal via import (" + r.warehouseName + ")"
    }));
    const { error: txError } = await sb.from('transactions').insert(txPayload);
    if (txError) throw txError;

    state.ui.stockImportRows = [];
    state.ui.stockImportFileName = "";
    await loadData();
    render();
    notify(uniqueRows.length + " baris stok awal berhasil diterapkan");
  } catch (e) {
    console.error('applyStockImport error:', e);
    notify("Gagal import stok: " + (e.message || e), "error");
  }
}

async function applySalesImport() {
  const rows = state.ui.salesImportRows.filter(r => r.status === "new" || r.status === "update");
  if (rows.length === 0) return;

  notify("Menerapkan " + rows.length + " baris, mohon tunggu...", "warning");

  try {
    const newRows = rows.filter(r => !state.data.salesTeam.find(s => s.id.toLowerCase() === r.id.toLowerCase()));
    const updateRows = rows.filter(r => state.data.salesTeam.find(s => s.id.toLowerCase() === r.id.toLowerCase()));

    // Bulk-update existing sales (still one request per row, but run
    // concurrently instead of waiting for each one before starting the next)
    if (updateRows.length) {
      const results = await Promise.all(updateRows.map(r =>
        sb.from('sales_team').update({ name: r.name, gudang: r.gudang, supervisor: r.supervisor }).eq('id', r.id)
      ));
      const firstError = results.find(res => res.error);
      if (firstError) throw firstError.error;
    }

    // Bulk-insert all new sales in a single request
    if (newRows.length) {
      const { error: insError } = await sb.from('sales_team').insert(
        newRows.map(r => ({ id: r.id, name: r.name, gudang: r.gudang, supervisor: r.supervisor }))
      );
      if (insError) throw insError;

      // Bulk-insert the initial (qty=0) sales_stock rows for every new
      // sales x every product, in one request instead of one per row
      const stockPayload = [];
      newRows.forEach(r => {
        state.data.products.forEach(p => stockPayload.push({ sales_id: r.id, product_id: p.id, qty: 0 }));
      });
      if (stockPayload.length) {
        const { error: ssError } = await sb.from('sales_stock').insert(stockPayload);
        if (ssError) throw ssError;
      }
    }

    state.ui.salesImportRows = [];
    state.ui.salesImportFileName = "";
    if (rows.length && !state.ui.salesSelectedStok) state.ui.salesSelectedStok = rows[0].id;
    await loadData();
    render();
    notify(newRows.length + " sales baru ditambahkan, " + updateRows.length + " sales diperbarui");
  } catch (e) {
    console.error('applySalesImport error:', e);
    notify("Gagal import sales: " + (e.message || e), "error");
  }
}

// ---------------- autentikasi & manajemen pengguna ----------------
function isHQ() { return state.session && state.session.role === "hq"; }
function isPusatAdmin() { return state.session && state.session.role === "admin_pusat"; }
function isCabangAdmin() { return state.session && state.session.role === "admin_cabang"; }
function isPusatOrHQ() { return isPusatAdmin() || isHQ(); }
function myCabangId() { return state.session ? state.session.cabangId : ""; }
function myGudangPusatId() { return state.session ? state.session.gudangPusat : ""; }
function myCluster() {
  if (isPusatAdmin()) {
    const wh = state.data.warehouses.find(w => w.id === myGudangPusatId());
    return wh ? wh.kota : null;
  }
  if (isCabangAdmin()) {
    const wh = state.data.warehouses.find(w => w.id === myCabangId());
    return wh ? wh.cluster : null;
  }
  return null;
}
function myClusterProducts() {
  if (!isPusatAdmin() && !isCabangAdmin()) return state.data.products;
  const cluster = myCluster();
  if (!cluster) return [];
  return state.data.products.filter(p => p.cluster === cluster);
}
function warehouseCluster(wh) {
  if (!wh) return null;
  return wh.type === "pusat" ? wh.kota : wh.cluster;
}
function locationCluster(id) {
  const wh = state.data.warehouses.find(w => w.id === id);
  if (wh) return warehouseCluster(wh);
  const sales = state.data.salesTeam.find(s => s.id === id);
  if (sales) return warehouseCluster(state.data.warehouses.find(w => w.id === sales.gudang));
  return null;
}
function userCluster(u) {
  if (u.role === "hq") return null;
  if (u.role === "admin_pusat") return warehouseCluster(state.data.warehouses.find(w => w.id === u.gudangPusat));
  if (u.role === "admin_cabang") return warehouseCluster(state.data.warehouses.find(w => w.id === u.cabangId));
  return null;
}

async function doLogin() {
  const username = (document.getElementById("login-username")||{}).value || "";
  const password = (document.getElementById("login-password")||{}).value || "";
  const user = state.data.users.find(u => u.username.toLowerCase() === username.trim().toLowerCase() && u.password === password);
  if (!user) { state.ui.loginError = "Username atau password salah"; render(); return; }
  state.session = user;
  state.ui.loginError = "";
  if (isCabangAdmin() && state.tab === "pusat") state.tab = "dashboard";
  try { localStorage.setItem(SESSION_KEY, user.id); } catch (e) {}
  render();
}
async function doLogout() {
  state.session = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  render();
}
async function addUser(username, password, name, role, cabangId, gudangPusat) {
  username = (username||"").trim();
  password = (password||"").trim();
  name = (name||"").trim();

  if (!username || !password || !name)
    return notify("Username, password, dan nama wajib diisi", "error");
  if (role === "hq" && !isHQ())
    return notify("Hanya akun Head Quarter yang bisa menambahkan akun Head Quarter", "error");
  if (state.data.users.find(u => u.username.toLowerCase() === username.toLowerCase()))
    return notify("Username \"" + username + "\" sudah dipakai", "error");
  if (role === "admin_cabang" && !cabangId)
    return notify("Pilih gudang cabang untuk akun ini", "error");
  if (role === "admin_cabang" && isPusatAdmin()) {
    const wh = state.data.warehouses.find(w => w.id === cabangId);
    if (!wh || wh.cluster !== myCluster())
      return notify("Anda hanya bisa menambahkan akun untuk gudang cabang di cluster Anda sendiri", "error");
  }

  try {
    const { error: userInsertError } = await sb.from('users').insert({
      username: username,
      password: password,
      name: name,
      role: role,
      cabang_id: role === "admin_cabang" ? cabangId : null,
      gudang_pusat_id: role === "admin_pusat" ? (gudangPusat || (isPusatAdmin() ? myGudangPusatId() : null)) : null
    });
    if (userInsertError) throw userInsertError;

    await loadData();
    render();
    notify("Akun " + name + " berhasil ditambahkan");
  } catch (e) {
    console.error('addUser error:', e);
    notify("Gagal menambahkan user: " + (e.message || e), "error");
  }
}
async function deleteUser(userId) {
  const u = state.data.users.find(x => x.id === userId);
  if (!u) return;
  if (u.role === "hq" && !isHQ())
    return notify("Tidak punya izin menghapus akun Head Quarter", "error");

  const hqAdmins = state.data.users.filter(x => x.role === "hq");
  if (u.role === "hq" && hqAdmins.length <= 1)
    return notify("Tidak bisa menghapus satu-satunya akun Head Quarter", "error");

  const pusatAdmins = state.data.users.filter(x => x.role === "admin_pusat");
  if (u.role === "admin_pusat" && pusatAdmins.length <= 1)
    return notify("Tidak bisa menghapus satu-satunya akun Admin Pusat", "error");

  if (state.session && state.session.id === userId)
    return notify("Tidak bisa menghapus akun sendiri", "error");

  try {
    const { error } = await sb.from('users').delete().eq('id', userId);
    if (error) return notify("Gagal hapus user: " + error.message, "error");
    
    await loadData();
    render();
    notify("User " + u.name + " berhasil dihapus", "success");
  } catch (e) {
    console.error('deleteUser error:', e);
    notify("Gagal menghapus user: " + (e.message || e), "error");
  }
}

// ---------------- mini SVG charts ----------------
function areaChartSvg(points) {
  const w = 640, h = 220, padL = 34, padB = 22, padT = 10, padR = 10;
  const max = Math.max(1, ...points.map(p=>Math.max(p.masuk,p.keluar)));
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const stepX = points.length>1 ? innerW/(points.length-1) : 0;
  const xy = (i,v) => [padL + i*stepX, padT + innerH - (v/max)*innerH];
  function pathFor(key) {
    return points.map((p,i)=>{ const [x,y]=xy(i,p[key]); return (i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1); }).join(" ");
  }
  function areaFor(key) {
    const line = pathFor(key);
    const [xlast] = xy(points.length-1,0);
    const [xfirst] = xy(0,0);
    return line + " L" + xlast.toFixed(1) + "," + (padT+innerH) + " L" + xfirst.toFixed(1) + "," + (padT+innerH) + " Z";
  }
  let gridlines = "";
  for (let g=0; g<=4; g++) {
    const y = padT + innerH - (g/4)*innerH;
    gridlines += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="#e3edee" stroke-width="1"/>';
    gridlines += '<text x="4" y="'+(y+3).toFixed(1)+'" font-size="10" fill="#93aeb2">'+Math.round(max*g/4)+'</text>';
  }
  let labels = "";
  points.forEach((p,i) => { if (i % 2 === 0) { const [x] = xy(i,0); labels += '<text x="'+x.toFixed(1)+'" y="'+(h-4)+'" font-size="10" fill="#93aeb2" text-anchor="middle">'+p.name+'</text>'; } });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-height:240px">' +
    gridlines +
    '<path d="'+areaFor("masuk")+'" fill="#c6e6e3" opacity="0.6"/>' +
    '<path d="'+pathFor("masuk")+'" fill="none" stroke="#6aa9a5" stroke-width="2"/>' +
    '<path d="'+areaFor("keluar")+'" fill="#ffd0d0" opacity="0.55"/>' +
    '<path d="'+pathFor("keluar")+'" fill="none" stroke="#db1a1a" stroke-width="2"/>' +
    labels +
  '</svg>';
}
function donutSvg(segments) {
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  const cx=90, cy=90, r=62, sw=26;
  let angle = -90, paths = "";
  segments.forEach(s => {
    const frac = s.value/total;
    const start = angle;
    const end = angle + frac*360;
    angle = end;
    const large = (end-start) > 180 ? 1 : 0;
    const toRad = a => (a*Math.PI/180);
    const x1 = cx + r*Math.cos(toRad(start)), y1 = cy + r*Math.sin(toRad(start));
    const x2 = cx + r*Math.cos(toRad(end)), y2 = cy + r*Math.sin(toRad(end));
    paths += '<path d="M'+x1.toFixed(2)+','+y1.toFixed(2)+' A'+r+','+r+' 0 '+large+' 1 '+x2.toFixed(2)+','+y2.toFixed(2)+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'"/>';
  });
  let legend = '<div>';
  segments.forEach(s => { legend += '<div class="legend-row"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.name)+': <strong>&nbsp;'+nfmt(s.value)+'</strong></div>'; });
  legend += '</div>';
  return '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><svg viewBox="0 0 180 180" width="180" height="180">'+paths+'</svg>'+legend+'</div>';
}
function barListHtml(items) {
  const max = Math.max(1, ...items.map(i=>i.qty));
  let html = "";
  items.forEach(i => {
    const pct = Math.round((i.qty/max)*100);
    html += '<div class="bar-row"><div class="bar-label" title="'+esc(i.name)+'">'+esc(i.name)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><div class="bar-val">'+nfmt(i.qty)+'</div></div>';
  });
  return html || '<p class="muted">Belum ada data penjualan.</p>';
}

  const clusterFilter = isHQ() ? state.ui.dashboardClusterFilter : "";
  const inCluster = (id) => !clusterFilter || locationCluster(id) === clusterFilter;
  const priceMap = buildPriceMap();

  const pusatWarehouses = state.data.warehouses.filter(w=>w.type==="pusat" && (!clusterFilter || warehouseCluster(w)===clusterFilter));
  const cabangWarehouses = state.data.warehouses.filter(w=>w.type==="cabang" && (!clusterFilter || warehouseCluster(w)===clusterFilter));
  const salesIds = clusterFilter ? state.data.salesTeam.filter(s=>locationCluster(s.id)===clusterFilter).map(s=>s.id) : Object.keys(state.data.salesStock);

  const totalPusat = pusatWarehouses.reduce((acc,w)=>acc+Object.values(state.data.stock[w.id]||{}).reduce((a,b)=>a+b,0),0);
  const totalCabang = cabangWarehouses.reduce((acc,w)=>acc+Object.values(state.data.stock[w.id]||{}).reduce((a,b)=>a+b,0),0);
  const totalSales = salesIds.reduce((acc,id)=>acc+Object.values(state.data.salesStock[id]||{}).reduce((a,b)=>a+b,0),0);
  const totalPusatValue = pusatWarehouses.reduce((acc,w)=>acc+sumStockValue(state.data.stock[w.id], priceMap),0);
  const totalCabangValue = cabangWarehouses.reduce((acc,w)=>acc+sumStockValue(state.data.stock[w.id], priceMap),0);
  const totalSalesValue = salesIds.reduce((acc,id)=>acc+sumStockValue(state.data.salesStock[id], priceMap),0);
  const pendingReplacement = state.data.returItems.filter(r=>r.status==="menunggu_penggantian" && inCluster(r.sourceId));
  const pendingQty = pendingReplacement.reduce((a,r)=>a+r.qty,0);

  const periodTx = state.data.transactions.filter(t => inPeriod(t.date));
  const masukTx = periodTx.filter(t=>t.type==="masuk" && inCluster(t.to));
  const terjualTx = periodTx.filter(t=>t.type==="penjualan" && inCluster(t.from));
  const masukPeriode = masukTx.reduce((a,t)=>a+t.qty,0);
  const terjualPeriode = terjualTx.reduce((a,t)=>a+t.qty,0);

  const terjualPeriodeValue = terjualTx.reduce((a,t)=>a+t.qty*(priceMap[t.productId]||0),0);

  const { start, end } = getPeriodRange();
  const spanDays = (start && end) ? Math.ceil((end-start)/86400000) : null;
  const groupByMonth = spanDays !== null && spanDays > 31;
  const map = {};
  periodTx.forEach(t => {
    const key = groupByMonth ? fmtMonthShort(t.date) : fmtDateShort(t.date);
    if (!map[key]) map[key] = { name: key, masuk: 0, keluar: 0, _t: new Date(t.date).getTime() };

        '<div class="flow-node"><div class="lbl">Gudang Pusat</div><div class="val">'+nfmt(totalPusat)+'</div><div class="sub">'+rupiah(totalPusatValue)+'</div></div>' +

function renderGudangPusatNasional(priceMap) {
  priceMap = priceMap || buildPriceMap();
  const pusatList = state.data.warehouses.filter(w=>w.type==="pusat");
  const clusters = Array.from(new Set(pusatList.map(w=>w.kota).filter(Boolean))).sort();
  const filter = state.ui.dashboardClusterFilter;
  let rows = pusatList.map(w => {
    const stock = state.data.stock[w.id] || {};
    const qty = Object.values(stock).reduce((a,b)=>a+b,0);
    return { id: w.id, name: w.name, cluster: w.kota || "-", qty, value: sumStockValue(stock, priceMap) };
  });
  if (filter) rows = rows.filter(r => r.cluster === filter);
  const sort = state.ui.dashboardPusatSort;
  if (sort === "qty") rows.sort((a,b)=>b.qty-a.qty);
  else if (sort === "value") rows.sort((a,b)=>b.value-a.value);
  else rows.sort((a,b)=>a.cluster.localeCompare(b.cluster));
  const totalQty = rows.reduce((a,r)=>a+r.qty,0);
  const totalValue = rows.reduce((a,r)=>a+r.value,0);
  return '<div class="section"><div class="section-head"><h3>Gudang Pusat Nasional</h3>' +
      '<div class="row">' +
        '<select class="input" onchange="onDashboardClusterFilter(this.value)">' +
          '<option value="">Semua cluster</option>' +
          clusters.map(c=>'<option value="'+esc(c)+'"'+(c===filter?" selected":"")+'>'+esc(c)+'</option>').join("") +
        '</select>' +
        '<select class="input" onchange="onDashboardPusatSort(this.value)">' +
          '<option value="cluster"'+(sort==="cluster"?" selected":"")+'>Urutkan: Cluster</option>' +
          '<option value="qty"'+(sort==="qty"?" selected":"")+'>Urutkan: Stok tertinggi</option>' +
          '<option value="value"'+(sort==="value"?" selected":"")+'>Urutkan: Nilai tertinggi</option>' +
        '</select>' +
      '</div>' +
    '</div>' +
    '<div class="grid grid-3">' +
      (rows.length ? rows.map(r => statCard(r.cluster, nfmt(r.qty), r.qty>0?"indigo":"slate", r.name + ' \u00b7 ' + rupiah(r.value) + ' \u00b7 ' + (r.qty>0?"Ready":"Kosong"))).join("") :
        '<p class="muted">Tidak ada gudang pusat untuk cluster ini.</p>') +
    '</div>' +
    (rows.length ? '<p class="muted" style="margin-top:10px">Total '+rows.length+' gudang &middot; '+nfmt(totalQty)+' unit &middot; '+rupiah(totalValue)+'</p>' : "") +
  '</div>';
}

function normalize(s) { return (s||"").toString().trim().toLowerCase(); }

function buildSalesUploadRows(dataRows) {
  let skippedNotCompleted = 0;
  const groups = {};
  dataRows.forEach(r => {
    const statusRaw = pickField(r, ["Status Order","status order","status"]).toString();
    if (normalize(statusRaw) !== "completed") { if (statusRaw) skippedNotCompleted++; return; }
    const productId = pickField(r, ["Product ID","product id","kode produk","sku"]).toString().trim();
    const canvasserId = pickField(r, ["Canvasser ID","canvasser id","sales id","id sales"]).toString().trim();
    const canvasserName = pickField(r, ["Canvasser Name","canvasser name","nama sales"]).toString().trim();
    const qtyRaw = pickField(r, ["Total Product","total product","qty","jumlah"]);
    const qty = parseInt((qtyRaw||"0").toString().replace(/[^0-9-]/g,""), 10) || 0;
    if (!productId && !canvasserId) return;
    const key = canvasserId + "||" + productId;
    if (!groups[key]) groups[key] = { productId, canvasserId, canvasserName, qty: 0 };
    groups[key].qty += qty;
  });

  const rows = Object.values(groups).map((g, i) => {
    const prod = state.data.products.find(p => p.id === g.productId);
    const sales = state.data.salesTeam.find(s => s.id === g.canvasserId);
    let status = "ok", issue = "";
    if (!sales) { status = "error"; issue = "Sales (Canvasser ID) tidak ditemukan"; }
    else if (!prod) { status = "error"; issue = "Produk tidak ditemukan"; }
    else if (!g.qty || g.qty <= 0) { status = "error"; issue = "Jumlah tidak valid"; }
    else {
      const avail = state.data.salesStock[sales.id]?.[prod.id] || 0;
      if (g.qty > avail) { status = "error"; issue = "Stok sales hanya " + avail; }
    }
    return {
      key: i, qty: g.qty,
      salesId: sales ? sales.id : g.canvasserId, salesName: sales ? sales.name : (g.canvasserName || g.canvasserId || "-"),
      productId: prod ? prod.id : g.productId, productName: prod ? prod.name : g.productId,
      status, issue,
    };
  });
  rows._skippedNotCompleted = skippedNotCompleted;
  return rows;
}

function handleUploadFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  state.ui.uploadFileName = file.name;
  const ext = file.name.split(".").pop().toLowerCase();
  if (ext === "csv") {
    Papa.parse(file, { header: true, skipEmptyLines: true, complete: (results) => {
      state.ui.uploadRows = buildSalesUploadRows(results.data);
      render();
    }});
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      state.ui.uploadRows = buildSalesUploadRows(rows);
      render();
    };
    reader.readAsArrayBuffer(file);
  }
}

      rows.map(r => '<tr><td>'+esc(r.salesName)+' <span class="muted">('+esc(r.salesId)+')</span></td><td>'+esc(r.productName)+'</td><td class="num">'+nfmt(r.qty)+'</td><td>' + (r.status==="ok" ? '<span class="badge badge-ok">&#10003; Siap diproses</span>' : '<span class="badge badge-err">&#9888; '+esc(r.issue)+'</span>') + '</td></tr>').join("") +

  html += '</div>';
  return html;
}

function normKey(s) { return (s||"").toString().trim().toLowerCase().replace(/[^a-z0-9]/g, ""); }
function pickField(row, candidates) {
  const keys = Object.keys(row);
  for (const cand of candidates) {
    const nc = normKey(cand);
    const found = keys.find(k => normKey(k) === nc);
    if (found !== undefined && row[found] !== undefined && row[found] !== "") return row[found];
  }
  return "";
}
function parsePrice(v) {
  if (typeof v === "number") return Math.round(v);
  const digits = (v||"").toString().replace(/[^0-9]/g, "");
  return digits ? parseInt(digits, 10) : 0;
}
function buildCatalogRows(dataRows) {
  return dataRows.map((r, i) => {
    let id = pickField(r, ["Product ID","id","sku","kode","kode produk"]).toString().trim();
    const name = pickField(r, ["Product Name","nama produk","nama","name"]).toString().trim();
    const brand = pickField(r, ["Brand","merek"]).toString().trim();
    const category = pickField(r, ["Category","kategori"]).toString().trim();
    const price = parsePrice(pickField(r, ["Harga Paket (Rp)","Harga Paket","harga","price"]));
    const cluster = pickField(r, ["Sales Cluster","nama cluster gudang","cluster"]).toString().trim();
    const familyPaket = pickField(r, ["Family Paket","family","paket"]).toString().trim();
    const materialCode = pickField(r, ["Material Code","kode material"]).toString().trim();
    if (!id) id = (brand + "-" + name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || uid("prod");

    let status = "new", issue = "";
    if (!name || !brand) { status = "error"; issue = "Nama produk / brand kosong"; }
    else if (state.data.products.find(p => p.id === id)) { status = "update"; }

    return { key: i, id, name, brand, category, price, cluster, familyPaket, materialCode, status, issue };
  });
}

function onStatusSourceTypeChange(v) { state.ui.statusSourceType = v; render(); }
function onReportIssue() {
  const sourceId = document.getElementById("status-sourceid").value;
  const productId = document.getElementById("status-produk").value;
  const qty = Number(document.getElementById("status-qty").value);
  const reason = document.getElementById("status-reason").value;
  reportIssue(state.ui.statusSourceType, sourceId, productId, qty, reason);
}

function renderKelolaPengguna() {
  const cabangList = isPusatAdmin()
    ? state.data.warehouses.filter(w=>w.type==="cabang" && w.cluster===myCluster())
    : state.data.warehouses.filter(w=>w.type==="cabang");
  return '<div class="stack">' +
    '<div class="section"><div class="section-head"><h3>Tambah akun pengguna</h3></div>' +
      '<div class="row" style="align-items:flex-end">' +
        '<label class="field"><span>Username</span><input class="input" id="user-username" placeholder="mis. admin.cabang2"></label>' +
        '<label class="field"><span>Password</span><input class="input" id="user-password" placeholder="password"></label>' +
        '<label class="field"><span>Nama</span><input class="input" id="user-name" placeholder="Nama lengkap"></label>' +
        '<label class="field"><span>Role</span><select class="input" id="user-role" onchange="onUserRoleChange(this.value)">' +
          (isHQ() ? '<option value="hq">Head Quarter</option>' : '') +
          '<option value="admin_pusat">Admin Pusat</option><option value="admin_cabang" selected>Admin Cabang</option></select></label>' +
        '<label class="field" id="user-cabang-field"><span>Gudang Cabang</span><select class="input" id="user-cabang">' + cabangList.map(w=>'<option value="'+w.id+'">'+esc(w.name)+'</option>').join("") + '</select></label>' +
        (isHQ() ? '<label class="field" id="user-gudang-pusat-field" style="display:none"><span>Gudang Pusat</span><select class="input" id="user-gudang-pusat"><option value="">Pilih gudang pusat</option>' + state.data.warehouses.filter(w=>w.type==="pusat").map(w=>'<option value="'+w.id+'">'+esc(w.name)+'</option>').join("") + '</select></label>' : '') +
        '<button class="btn btn-primary" onclick="onAddUser()">Simpan</button>' +
      '</div>' +
    '</div>' +
    (function(){
      const visibleUsers = isHQ() ? state.data.users : state.data.users.filter(u=>u.role!=="hq" && userCluster(u)===myCluster());
      return '<div class="section"><div class="section-head"><h3>Daftar akun (' + visibleUsers.length + ')</h3></div>' +
      '<table class="tbl"><thead><tr><th>Username</th><th>Nama</th><th>Role</th><th>Gudang</th><th></th></tr></thead><tbody>' +
      visibleUsers.map(u => {
        const gudangName = u.role==="hq" ? "Nasional" : u.role==="admin_pusat" ? (u.gudangPusat ? (state.data.warehouses.find(w=>w.id===u.gudangPusat)||{}).name || "-" : "Semua gudang") : u.cabangId ? (state.data.warehouses.find(w=>w.id===u.cabangId)||{}).name || "-" : "Semua gudang";
        const roleBadge = u.role==="hq" ? '<span class="badge badge-hq">Head Quarter</span>' : u.role==="admin_pusat" ? '<span class="badge badge-transfer">Admin Pusat</span>' : '<span class="badge badge-distribusi">Admin Cabang</span>';
        return '<tr><td class="muted">'+esc(u.username)+'</td><td>'+esc(u.name)+'</td><td>' + roleBadge + '</td><td class="muted">'+esc(gudangName)+'</td><td><button class="btn btn-ghost" style="color:#b91414;border-color:#ffc2c2;padding:4px 10px" onclick="deleteUser(\''+u.id+'\')">Hapus</button></td></tr>';
      }).join("") +
      '</tbody></table>' +
    '</div>';
    })() +
  '</div>';
}
function onUserRoleChange(role) {
  document.getElementById("user-cabang-field").style.display = role === "admin_cabang" ? "flex" : "none";
  const gpField = document.getElementById("user-gudang-pusat-field");
  if (gpField) gpField.style.display = role === "admin_pusat" ? "flex" : "none";
}
function onAddUser() {
  const username = document.getElementById("user-username").value;
  const password = document.getElementById("user-password").value;
  const name = document.getElementById("user-name").value;
  const role = document.getElementById("user-role").value;
  const cabangId = document.getElementById("user-cabang").value;
  const gpEl = document.getElementById("user-gudang-pusat");
  const gudangPusat = gpEl ? gpEl.value : "";
  addUser(username, password, name, role, cabangId, gudangPusat);
}

function renderRiwayat() {
  const rows = state.data.transactions.filter(t => (!state.ui.riwayatFilter || t.type===state.ui.riwayatFilter) && inPeriod(t.date));
  return '<div class="stack">' +
    renderPeriodFilter() +
    '<div class="section"><div class="section-head"><h3>Riwayat transaksi &middot; ' + esc(periodLabel()) + ' (' + rows.length + ')</h3>' +
    '<select class="input" onchange="onRiwayatFilter(this.value)">' +
      '<option value="">Semua jenis</option>' +
      '<option value="masuk"' + (state.ui.riwayatFilter==="masuk"?" selected":"") + '>Barang masuk</option>' +
      '<option value="transfer"' + (state.ui.riwayatFilter==="transfer"?" selected":"") + '>Transfer gudang</option>' +
      '<option value="distribusi"' + (state.ui.riwayatFilter==="distribusi"?" selected":"") + '>Distribusi ke sales</option>' +
      '<option value="penjualan"' + (state.ui.riwayatFilter==="penjualan"?" selected":"") + '>Penjualan</option>' +
      '<option value="retur_keluar"' + (state.ui.riwayatFilter==="retur_keluar"?" selected":"") + '>Laporan bermasalah</option>' +
      '<option value="penggantian_masuk"' + (state.ui.riwayatFilter==="penggantian_masuk"?" selected":"") + '>Penggantian principal</option>' +
      '<option value="stok_awal"' + (state.ui.riwayatFilter==="stok_awal"?" selected":"") + '>Update stok awal</option>' +
    '</select></div>' +
    transactionTable(rows, false) +
    '</div>' +
  '</div>';
}
function onRiwayatFilter(v) { state.ui.riwayatFilter = v; render(); }

// ---------------- sidebar / topbar / root render ----------------
const TABS = [
  { id: "dashboard", label: "Dashboard" },
  { id: "katalog", label: "Katalog Barang" },
  { id: "pusat", label: "Gudang Pusat" },
  { id: "cabang", label: "Gudang Cabang" },
  { id: "distribusi", label: "Distribusi ke Sales" },
  { id: "stoksales", label: "Stok di Sales" },
  { id: "upload", label: "Upload Penjualan" },
  { id: "status", label: "Status Barang" },
  { id: "riwayat", label: "Riwayat Transaksi" },
  { id: "users", label: "Kelola Pengguna" },
];
function visibleTabs() {
  return TABS.filter(t => {
    if (t.id === "pusat") return isPusatOrHQ();
    if (t.id === "users") return isPusatOrHQ();
    return true;

function navIcon(id) {
  return '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#fff6f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + (NAV_ICONS[id]||"") + '</svg>';
}

function setTab(id) { state.tab = id; render(); }

function renderSidebar() {
  return '<div class="sidebar">' +
    '<div class="sidebar-brand"><div class="sidebar-brand-row">' + BRAND_LOGO_SVG +
      '<div class="sidebar-brand-title"><img src="' + BRAND_LOGO_WORDMARK + '" alt="Inventory Management" class="brand-wordmark"><small>' + esc(isHQ() ? "All Cluster Nasional" : "Gudang Pusat") + '</small></div>' +
    '</div>' + (myCluster() ? '<div class="sidebar-brand-sub">' + esc(myCluster()) + '</div>' : '') + '</div>' +
    '<div class="nav">' + NAV_ICON_DEFS + visibleTabs().map(t => '<button class="nav-item' + (state.tab===t.id?" active":"") + '" onclick="setTab(\''+t.id+'\')">'+navIcon(t.id)+'<span>'+t.label+'</span></button>').join("") + '</div>' +
    '<div class="sidebar-foot">Version 1.0<br>Copyright Reserved 2026<br>Pandawa Team</div>' +
  '</div>';
}
function renderTopbar() {
  const pending = state.data.returItems.filter(r=>r.status==="menunggu_penggantian").length;
  const roleLabel = isHQ() ? "Head Quarter" :
    isPusatAdmin() ? "Admin Pusat" + (myGudangPusatId() ? " \u2013 " + esc((state.data.warehouses.find(w=>w.id===myGudangPusatId())||{}).name||"") : "") :
    "Admin Cabang" + (myCabangId() ? " \u2013 " + esc((state.data.warehouses.find(w=>w.id===myCabangId())||{}).name||"") : "");
  return '<div class="topbar"><div class="topbar-date">' + new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) + '</div>' +
    '<div class="row" style="gap:14px">' +
    (pending>0 ? '<span class="pill-warning">&#9888; ' + pending + ' item menunggu penggantian principal</span>' : '') +
    '<div class="user-badge"><strong>' + esc(state.session.name) + '</strong><span>' + roleLabel + '</span></div>' +
    '<button class="btn btn-ghost" onclick="doLogout()">Keluar</button>' +
    '</div>' +
  '</div>';
}

function renderTabContent() {
  switch (state.tab) {
    case "dashboard": return renderDashboard();
    case "katalog": return renderKatalogBarang();
    case "pusat": return renderGudangPusat();
    case "cabang": return renderGudangCabang();
    case "distribusi": return renderDistribusi();
    case "stoksales": return renderStokSales();
    case "upload": return renderUploadPenjualan();
    case "status": return renderStatusBarang();
    case "riwayat": return renderRiwayat();
    case "users": return isPusatOrHQ() ? renderKelolaPengguna() : renderDashboard();
    default: return "";
  }
}

function render() {
  const root = document.getElementById("root");
  root.dataset.rendered = "1";
  if (state.loadError) {
    root.innerHTML = '<div style="padding:60px;max-width:600px;margin:0 auto;text-align:center;color:#db1a1a;font-family:sans-serif">' +
      '<b>Gagal terhubung ke database Supabase</b><br><br>' + esc(state.loadError) +
      '<br><br><span style="color:#5d7a80;font-size:13px">Cek: apakah tabel <code>app_state</code> sudah dibuat, dan apakah kebijakan RLS mengizinkan akses.</span></div>';
    return;
  }
  if (!state.session) { root.innerHTML = renderLogin(); return; }
  if (isCabangAdmin() && state.tab === "pusat") state.tab = "dashboard";
  if (state.tab === "users" && !isPusatOrHQ()) state.tab = "dashboard";
  root.innerHTML = renderSidebar() +
    '<div class="main">' + renderTopbar() + '<div class="content">' + renderTabContent() + '</div></div>';
  if (state.tab === "cabang") renderAvailPusat();
  if (state.tab === "distribusi") renderDistAvail();
}

window.addEventListener("error", function (e) {
  const root = document.getElementById("root");
  if (root && !root.dataset.rendered) {
    root.innerHTML = '<div style="padding:60px;max-width:600px;margin:0 auto;text-align:center;color:#db1a1a;font-family:sans-serif">' +
      '<b>Terjadi error saat memuat aplikasi</b><br><br>' + (e && e.message ? e.message : "Unknown error") + '</div>';
  }
});

(async function init() {
  document.getElementById("root").innerHTML = '<div style="padding:60px;text-align:center;color:#93aeb2">Memuat data gudang...</div>';
  try {
    await loadData();
    await restoreSession();
    render();
  } catch (e) {
    console.error("Init error:", e);
    document.getElementById("root").innerHTML =
      '<div style="padding:60px;max-width:600px;margin:0 auto;text-align:center;color:#db1a1a;font-family:sans-serif">' +
      '<b>Terjadi error saat memuat aplikasi</b><br><br>' + (e && e.message ? e.message : String(e)) + '</div>';
  }
})();
</script>
</body>
</html>
